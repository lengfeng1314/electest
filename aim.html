<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>瞄准精度测试</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0e17;color:#e8edf5;font-family:-apple-system,"PingFang SC",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:16px;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  h2{font-size:20px;margin-bottom:8px}
  .info{font-size:13px;color:#6b7c93;margin-bottom:16px;text-align:center;line-height:1.6}
  #arena{
    background:#131a26;border:1px solid #1e2a3d;border-radius:16px;
    width:100%;max-width:400px;height:400px;position:relative;overflow:hidden;
  }
  .target{
    position:absolute;width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle,#4ade80,#22c55e);
    border:2px solid #16a34a;cursor:pointer;
  }
  .target:active{transform:scale(.9)}
  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    width:100%;max-width:400px;margin-top:16px;
  }
  .stat{background:#131a26;border-radius:12px;padding:12px;text-align:center}
  .stat .label{font-size:11px;color:#6b7c93}
  .stat .value{font-size:22px;font-weight:600}
  button{
    margin-top:20px;background:#2563eb;color:#fff;border:none;border-radius:12px;
    padding:14px 40px;font-size:16px;font-weight:600;cursor:pointer;width:100%;max-width:400px;
  }
  button:disabled{background:#1e2a3d;color:#4a5a70}
  .hidden{display:none}
</style>
</head>
<body>
<h2>瞄准精度测试</h2>
<div class="info">点击随机出现的绿色目标<br>30秒内尽可能多命中</div>
<div id="arena"></div>
<div class="stats hidden" id="stats">
  <div class="stat"><div class="label">命中</div><div class="value" id="hits">0</div></div>
  <div class="stat"><div class="label">命中率</div><div class="value" id="acc">0%</div></div>
</div>
<button id="startBtn">开始测试</button>
<script src="shared.js"></script>
<script>
(function(){
  var arena=document.getElementById('arena');
  var hitsEl=document.getElementById('hits');
  var accEl=document.getElementById('acc');
  var statsEl=document.getElementById('stats');
  var startBtn=document.getElementById('startBtn');
  var hits=0,total=0,timeLeft=30,timer=null,active=false,curTarget=null;

  function spawnTarget(){
    if(curTarget&&curTarget.parentNode)curTarget.parentNode.removeChild(curTarget);
    var t=document.createElement('div');
    t.className='target';
    var maxX=arena.clientWidth-56;
    var maxY=arena.clientHeight-56;
    t.style.left=Math.random()*maxX+'px';
    t.style.top=Math.random()*maxY+'px';
    t.addEventListener('click',function(e){
      e.stopPropagation();
      if(!active)return;
      hits++;total++;
      hitsEl.textContent=hits;
      accEl.textContent=Math.round(hits/total*100)+'%';
      spawnTarget();
    });
    arena.appendChild(t);
    curTarget=t;
  }

  arena.addEventListener('click',function(){
    if(active)total++;
    if(total>0)accEl.textContent=Math.round(hits/total*100)+'%';
  });

  function tick(){
    timeLeft--;
    startBtn.textContent='剩余 '+timeLeft+' 秒';
    if(timeLeft<=0){
      clearInterval(timer);
      active=false;
      startBtn.disabled=false;
      startBtn.textContent='再测一次';
      var acc=total>0?Math.round(hits/total*100):0;
      accEl.textContent=acc+'%';
      saveScore('aim_raw',acc);
      saveScore('aim_dim',calcDimScore(acc,BENCHMARK.aim.pro,BENCHMARK.aim.avg,false));
      setTimeout(function(){location.href='apm.html';},2500);
    }
  }

  startBtn.addEventListener('click',function(){
    if(active)return;
    active=true;
    hits=0;total=0;timeLeft=30;
    hitsEl.textContent='0';accEl.textContent='0%';
    statsEl.classList.remove('hidden');
    startBtn.disabled=true;
    startBtn.textContent='剩余 30 秒';
    spawnTarget();
    timer=setInterval(tick,1000);
  });
})();
</script>
</body>
</html>
