<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>手速测试</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0e17;color:#e8edf5;font-family:-apple-system,"PingFang SC",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:16px;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  h2{font-size:20px;margin-bottom:8px}
  .info{font-size:13px;color:#6b7c93;margin-bottom:20px;text-align:center;line-height:1.6}
  .keys{display:flex;gap:16px;margin-bottom:20px}
  .key{
    width:140px;height:140px;border-radius:20px;background:#1a2436;
    border:2px solid #2a3a52;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:700;cursor:pointer;transition:background .08s;
  }
  .key:active{background:#2563eb;border-color:#3b82f6}
  .key.done{background:#0d2818;border-color:#1a5c32;color:#4ade80}
  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
    width:100%;max-width:360px;margin-bottom:16px;
  }
  .stat{background:#131a26;border-radius:12px;padding:14px;text-align:center}
  .stat .label{font-size:11px;color:#6b7c93}
  .stat .value{font-size:24px;font-weight:600}
  button{
    background:#2563eb;color:#fff;border:none;border-radius:12px;
    padding:14px 40px;font-size:16px;font-weight:600;cursor:pointer;
    width:100%;max-width:360px;
  }
  button:disabled{background:#1e2a3d;color:#4a5a70}
  .hidden{display:none}
</style>
</head>
<body>
<h2>手速测试</h2>
<div class="info">30秒内交替点击左右两个按钮</div>
<div class="stats hidden" id="stats">
  <div class="stat"><div class="label">剩余时间</div><div class="value" id="timer">30</div></div>
  <div class="stat"><div class="label">APM</div><div class="value" id="apm">0</div></div>
</div>
<div class="keys">
  <div class="key" id="keyL">左</div>
  <div class="key" id="keyR">右</div>
</div>
<button id="startBtn">开始测试</button>
<script src="shared.js"></script>
<script>
(function(){
  var keyL=document.getElementById('keyL');
  var keyR=document.getElementById('keyR');
  var timerEl=document.getElementById('timer');
  var apmEl=document.getElementById('apm');
  var statsEl=document.getElementById('stats');
  var startBtn=document.getElementById('startBtn');
  var count=0,timeLeft=30,timer=null,active=false,expectLeft=true;

  function press(){
    if(!active)return;
    count++;
    expectLeft=!expectLeft;
    keyL.classList.toggle('done',!expectLeft);
    keyR.classList.toggle('done',expectLeft);
  }

  keyL.addEventListener('click',function(){if(expectLeft)press();});
  keyR.addEventListener('click',function(){if(!expectLeft)press();});

  function tick(){
    timeLeft--;
    timerEl.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timer);
      active=false;
      startBtn.disabled=false;
      startBtn.textContent='再测一次';
      var apm=count*2;
      apmEl.textContent=apm;
      saveScore('apm_raw',apm);
      saveScore('apm_dim',calcDimScore(apm,BENCHMARK.apm.pro,BENCHMARK.apm.avg,false));
      setTimeout(function(){location.href='peripheral.html';},2500);
    }
  }

  startBtn.addEventListener('click',function(){
    if(active)return;
    active=true;
    count=0;timeLeft=30;expectLeft=true;
    timerEl.textContent='30';
    apmEl.textContent='0';
    statsEl.classList.remove('hidden');
    startBtn.disabled=true;
    startBtn.textContent='测试中...';
    keyL.classList.remove('done');
    keyR.classList.remove('done');
    timer=setInterval(tick,1000);
  });
})();
</script>
</body>
</html>
